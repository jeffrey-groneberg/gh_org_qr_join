name: Infra (Terraform)

# Manages Azure application infrastructure (infra/1_app) with Terraform. Runs
# only when files under infra/1_app change, so ordinary app releases never touch
# infrastructure. The 0_bootstrap layer (state account + CI identity) is applied
# once by a human and is intentionally NOT driven from CI. Pull requests get a
# plan; pushes to main apply, gated behind the (stricter) "production-infra"
# GitHub environment. Auth uses GitHub OIDC against a dedicated privileged
# identity — no secret/publish profile is stored.

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/1_app/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/1_app/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch: {}

concurrency:
  group: infra-terraform
  cancel-in-progress: false # never interrupt an in-flight apply

permissions:
  id-token: write # request the OIDC token
  contents: read
  pull-requests: write # post the plan summary on PRs

env:
  # OIDC auth for the azurerm/azuread providers and the azurerm state backend.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # tfvars supplied as environment variables (secrets never land in the repo).
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_github_client_id: ${{ secrets.TF_GITHUB_CLIENT_ID }}
  TF_VAR_github_client_secret: ${{ secrets.TF_GITHUB_CLIENT_SECRET }}
  TF_VAR_github_app_id: ${{ secrets.TF_GITHUB_APP_ID }}
  TF_VAR_github_app_private_key: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
  TF_VAR_github_webhook_secret: ${{ secrets.TF_GITHUB_WEBHOOK_SECRET }}
  # Name of the infra identity created by 0_bootstrap (not secret). Needed so
  # 1_app can read it; defaults differ per environment, so pass it explicitly.
  TF_VAR_infra_identity_name: ${{ vars.INFRA_IDENTITY_NAME }}

defaults:
  run:
    working-directory: infra/1_app

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/1_app/tfplan
          retention-days: 5
          if-no-files-found: error

  apply:
    needs: plan
    # Only apply on a push to main (not on PRs). Approval is enforced by the
    # protection rules on the "production-infra" environment.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/1_app

      - name: Terraform apply
        run: terraform apply -input=false -no-color tfplan
