<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}QR Org Join{% endblock %}</title>
    <style>
      /* ---- Microsoft Fluent / M365 Copilot design language --------------
         Light surfaces, Segoe UI, Microsoft communication blue, soft depth,
         and the Copilot gradient (blue -> violet -> magenta) used sparingly as
         the one signature accent. */
      :root {
        --bg: #f3f5f9;
        --card: #ffffff;
        --line: #e1dfdd;          /* Fluent neutralQuaternaryAlt */
        --line-strong: #c8c6c4;   /* Fluent neutralTertiaryAlt */
        --ink: #242424;           /* Fluent neutralPrimary */
        --ink-2: #424242;
        --muted: #616161;         /* Fluent neutralSecondary */
        --subtle: #8a8886;
        --accent: #0f6cbd;        /* Fluent 2 brand */
        --accent-hover: #115ea3;
        --accent-press: #0c5089;
        --accent-soft: #eff6fc;
        --danger: #a4262c;
        --danger-bg: #fde7e9;
        --success: #0e700e;
        --success-bg: #dff6dd;
        --warn-bg: #fff4ce;
        --warn-ink: #4d4400;
        --copilot: linear-gradient(118deg, #2664e0 0%, #6b4bd6 48%, #c75cae 82%, #e06a4e 100%);
        --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
          "Helvetica Neue", Arial, sans-serif;
        --mono: "Cascadia Code", "Cascadia Mono", ui-monospace, Consolas,
          "SF Mono", Menlo, monospace;
        --shadow-8: 0 1.6px 3.6px rgba(0, 0, 0, 0.10), 0 0.3px 0.9px rgba(0, 0, 0, 0.07);
        --shadow-16: 0 3.2px 7.2px rgba(0, 0, 0, 0.11), 0 0.6px 1.8px rgba(0, 0, 0, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        background-color: var(--bg);
        /* Subtle Copilot-style ambient wash, kept very light. */
        background-image:
          radial-gradient(1100px 520px at 78% -12%, rgba(108, 75, 214, 0.10), transparent 60%),
          radial-gradient(900px 480px at 12% 8%, rgba(38, 100, 224, 0.08), transparent 55%);
        background-attachment: fixed;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 34px 32px;
        text-align: center;
        box-shadow: var(--shadow-16);
      }
      .card.wide { max-width: 800px; text-align: left; }
      .card.project { max-width: 560px; }

      .eyebrow {
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 12px;
      }
      h1 {
        font-weight: 600;
        font-size: 1.5rem;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
        color: var(--ink);
      }
      h1 + h1 { margin-top: 34px; }
      .org, .accent {
        background: var(--copilot);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p.lead { color: var(--muted); margin: 0 0 24px; font-size: 0.98rem; }
      p.lead a { color: var(--accent); text-decoration: none; font-weight: 600; }
      p.lead a:hover { text-decoration: underline; }

      /* ---- QR panel ---------------------------------------------------- */
      .qr {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        display: inline-block;
        line-height: 0;
        box-shadow: var(--shadow-8);
        width: 236px;
      }
      .qr.xl { width: 328px; }
      .qr svg { width: 100%; height: auto; display: block; }
      .hint { color: var(--subtle); font-size: 0.82rem; margin: 14px 0 24px; }

      /* ---- Buttons (Fluent) -------------------------------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 11px 20px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: var(--accent);
        color: #fff;
        font-family: var(--font);
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .btn:hover { background: var(--accent-hover); }
      .btn:active { background: var(--accent-press); }
      .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .btn svg { fill: currentColor; }
      .btn-secondary {
        background: #fff;
        color: var(--ink);
        border-color: var(--line-strong);
      }
      .btn-secondary:hover { background: #f5f5f5; }
      .btn-danger {
        background: #fff;
        color: var(--danger);
        border-color: #e6b0b3;
      }
      .btn-danger:hover { background: var(--danger-bg); }
      .btn-sm { width: auto; padding: 6px 14px; font-size: 0.85rem; }
      .btn-icon {
        width: 30px;
        height: 30px;
        padding: 0;
        flex: 0 0 auto;
        border-radius: 6px;
      }
      .btn-icon svg { display: block; }

      form { margin: 0; }
      .who { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; }
      .who strong { color: var(--ink); }

      /* ---- Message bars (Fluent) --------------------------------------- */
      .alert, .notice, .warn {
        border-radius: 6px;
        padding: 11px 14px;
        font-size: 0.88rem;
        margin-bottom: 20px;
        text-align: left;
        border: 1px solid transparent;
      }
      .alert { background: var(--danger-bg); color: var(--danger); border-color: #f1c7ca; }
      .notice { background: var(--success-bg); color: var(--success); border-color: #bfe5bd; }
      .warn { background: var(--warn-bg); color: var(--warn-ink); border-color: #f2e3a3; }
      .notice code { color: var(--success); background: #cdeccb; }

      .check-banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
      .check-banner form { margin: 0; }

      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 600;
        border: 1px solid var(--line-strong);
        color: var(--muted);
        background: #fafafa;
        vertical-align: middle;
      }
      .badge.ok { color: var(--success); background: var(--success-bg); border-color: #bfe5bd; }
      .badge.no_access { color: var(--warn-ink); background: var(--warn-bg); border-color: #f2e3a3; }
      .badge.missing, .badge.error { color: var(--danger); background: var(--danger-bg); border-color: #f1c7ca; }

      .success { text-align: left; }
      .success h2 { font-size: 1.15rem; margin: 0 0 8px; }
      .success p { color: var(--muted); font-size: 0.92rem; margin: 0 0 18px; }
      .footer-link { margin-top: 18px; }
      .footer-link a { color: var(--muted); font-size: 0.82rem; text-decoration: none; }
      .footer-link a:hover { color: var(--accent); text-decoration: underline; }

      /* ---- Table (organizer console) ----------------------------------- */
      table { width: 100%; border-collapse: collapse; margin: 12px 0 28px; }
      th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.72rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      td .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .passcell { display: inline-flex; align-items: center; gap: 8px; }

      label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink-2); margin: 14px 0 6px; }
      input[type="text"], select {
        width: 100%;
        padding: 9px 12px;
        border-radius: 4px;
        border: 1px solid var(--line-strong);
        border-bottom: 2px solid var(--subtle);
        background: #fff;
        color: var(--ink);
        font-family: var(--font);
        font-size: 0.95rem;
      }
      input[type="text"]:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
      .row > div { flex: 1; min-width: 150px; }
      code { font-family: var(--mono); color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
      code.pass { font-weight: 700; letter-spacing: 0.1em; font-size: 0.95rem; border: 1px solid #cfe4f6; }

      /* ---- Passcode tiles (signature, Fluent + Copilot gradient) ------- */
      .flapcode { display: inline-flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin: 6px 0 18px; }
      .flapgroup { display: inline-flex; gap: 8px; }
      .flap {
        min-width: 40px;
        padding: 12px 6px;
        font-family: var(--mono);
        font-weight: 700;
        font-size: 1.7rem;
        line-height: 1;
        text-align: center;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow-8);
      }
      .flapcode.lg { perspective: 800px; }
      .flapcode.lg .flap {
        position: relative;
        width: 66px;
        height: 92px;
        padding: 0;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow-16);
        /* Fallback (JS off / reduced motion): the server-rendered char shows. */
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        background: var(--copilot);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* ---- Split-flap (Solari) leaves — only the top half folds down ---- */
      /* The tile is split at the seam. The hinged top leaf folds down from the
         centre (rotateX 0 -> -90), revealing the new glyph's top half behind it;
         then the incoming bottom leaf drops in (rotateX 90 -> 0). Built by JS. */
      .flapcode.lg .flap.sf {
        background: transparent;
        border: 0;
        box-shadow: none;
        overflow: visible;
        perspective: 620px;
      }
      .sf-half {
        position: absolute;
        left: 0;
        right: 0;
        height: 50%;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .sf-half .ch {
        position: absolute;
        left: 0;
        right: 0;
        height: 92px;            /* full tile height so the glyph spans both halves */
        line-height: 92px;
        text-align: center;
        font-family: var(--mono);
        font-weight: 700;
        font-size: 3rem;
        background: var(--copilot);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sf-top {
        top: 0;
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 12px 12px 0 0;
        background: #ffffff;
        transform-origin: center bottom;
      }
      .sf-top .ch { top: 0; }
      .sf-bottom {
        bottom: 0;
        border: 1px solid var(--line);
        border-top: 0;
        border-radius: 0 0 12px 12px;
        background: #ffffff;       /* uniform bright lower half (no two-tone) */
        transform-origin: center top;
      }
      .sf-bottom .ch { bottom: 0; }
      /* No static seam at rest: tiles read as one clean white card. The split
         only becomes visible while the leaf is folding (via the 3D perspective),
         and there is no shadow, so the bottom half never darkens. */
      .sf-flip { z-index: 3; }

      /* ---- Segmented join-code entry (mirrors the projector flap tiles) --- */
      /* A single hidden input captures typing/paste seamlessly; the value is
         mirrored into two rows of four cells styled like the projector code. */
      .codeentry { position: relative; display: inline-block; margin: 4px 0 6px; }
      .codeentry .code-real {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: transparent;
        caret-color: transparent;
        font-size: 16px;            /* >=16px avoids iOS zoom-on-focus */
        text-align: center;
        cursor: text;
        outline: none;
        z-index: 2;
      }
      .codeentry .code-real::selection { background: transparent; }
      .codecells {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      .codecells .flapgroup { display: inline-flex; gap: 10px; }
      .cell {
        width: 52px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow-8);
        transition: border-color 0.12s ease, box-shadow 0.12s ease;
      }
      .cell .g {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 2.1rem;
        line-height: 1;
        /* same Copilot-gradient glyphs as the projector tiles */
        background: var(--copilot);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .cell.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      /* ---- Hero (landing) ---------------------------------------------- */
      .hero .spark {
        width: 44px;
        height: 44px;
        margin: 0 auto 18px;
        border-radius: 12px;
        background: var(--copilot);
        box-shadow: var(--shadow-8);
      }
      .hero h1 { font-size: clamp(1.9rem, 5.5vw, 2.6rem); line-height: 1.08; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="card {% block card_class %}{% endblock %}">
      {% block body %}{% endblock %}
    </main>
  </body>
</html>
