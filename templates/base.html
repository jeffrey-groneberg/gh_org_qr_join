<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}QR Org Join{% endblock %}</title>
    <style>
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #238636;
        --accent-hover: #2ea043;
        --danger-bg: #3d1c1c;
        --danger-border: #f85149;
        --notice-bg: #12261e;
        --notice-border: #2ea043;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px;
        text-align: center;
      }
      .card.wide { max-width: 720px; text-align: left; }
      h1 { font-size: 1.4rem; margin: 0 0 4px; }
      .org { color: var(--accent-hover); }
      p.lead { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
      .qr {
        background: #fff;
        border-radius: 8px;
        padding: 12px;
        display: inline-block;
        line-height: 0;
      }
      .qr svg { width: 200px; height: 200px; }
      .hint { color: var(--muted); font-size: 0.8rem; margin: 12px 0 24px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover { background: var(--accent-hover); }
      .btn svg { fill: currentColor; }
      .btn-secondary { background: transparent; color: var(--text); }
      .btn-secondary:hover { background: #21262d; }
      .btn-danger { background: transparent; color: #ff7b72; border-color: var(--danger-border); }
      .btn-danger:hover { background: var(--danger-bg); }
      .btn-sm { width: auto; padding: 6px 12px; font-size: 0.85rem; }
      form { margin: 0; }
      .who { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
      .who strong { color: var(--text); }
      .alert {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: #ffdcd7;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.85rem;
        margin-bottom: 20px;
        text-align: left;
      }
      .notice {
        background: var(--notice-bg);
        border: 1px solid var(--notice-border);
        color: #b9f6ca;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.85rem;
        margin-bottom: 20px;
        text-align: left;
      }
      .success { text-align: left; }
      .success h2 { font-size: 1.1rem; margin: 0 0 8px; }
      .success p { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
      .footer-link { margin-top: 16px; }
      .footer-link a { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
      .footer-link a:hover { text-decoration: underline; }
      table { width: 100%; border-collapse: collapse; margin: 8px 0 24px; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
      th { color: var(--muted); font-weight: 600; }
      td .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      label { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 4px; }
      input[type="text"], select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0d1117;
        color: var(--text);
        font-size: 0.95rem;
      }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
      .row > div { flex: 1; min-width: 140px; }
      code { color: var(--accent-hover); background: #0d1117; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main class="card {% block card_class %}{% endblock %}">
      {% block body %}{% endblock %}
    </main>
  </body>
</html>
